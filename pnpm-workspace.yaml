packages:
  - apps/*
  - packages/*
# pnpm 10
onlyBuiltDependencies:
  - esbuild
  - sharp
# pnpm 11 (Hostinger's build runs pnpm 11 whatever packageManager says)
allowBuilds:
  esbuild: true
  sharp: true
pmOnFail: ignore
minimumReleaseAge: 0
# Plain node_modules folders instead of symlinks, so Next's standalone output
# (what Hostinger publishes) carries real copies of its dependencies.
nodeLinker: hoisted
